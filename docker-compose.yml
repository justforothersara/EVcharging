# 新竹市充電站數據分析平台：本機開發用（階段 1）
# 啟動：docker compose up -d --build

# beat 和 4 個 worker 共用的設定
x-app: &app
  build: .
  image: evcharging:latest
  environment:
    CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//
    MYSQL_HOST: mysql
    MYSQL_PORT: "3306"
    MYSQL_USER: ${MYSQL_USER}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    MYSQL_DATABASE: ${MYSQL_DATABASE}
    TDX_CLIENT_ID: ${TDX_CLIENT_ID}
    TDX_CLIENT_SECRET: ${TDX_CLIENT_SECRET}
    ARCHIVE_TARGET: local
    ARCHIVE_DIR: /data/archive
  depends_on:
    rabbitmq:
      condition: service_healthy
    mysql:
      condition: service_healthy
  restart: unless-stopped

# Redash 3 個服務共用的環境變數
x-redash-env: &redash-env
  PYTHONUNBUFFERED: "0"
  REDASH_LOG_LEVEL: INFO
  REDASH_REDIS_URL: redis://redis:6379/0
  REDASH_DATABASE_URL: postgresql://postgres:${REDASH_POSTGRES_PASSWORD}@postgres/postgres
  REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
  REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
  REDASH_ENFORCE_CSRF: "true"
  REDASH_GUNICORN_TIMEOUT: "60"

# Redash 3 個服務共用的設定
x-redash: &redash
  image: redash/redash:26.9.0
  environment: *redash-env
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"   # 管理介面
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 給 005_readonly_user.sh 建立唯讀帳號用
      MYSQL_RO_USER: ${MYSQL_RO_USER}
      MYSQL_RO_PASSWORD: ${MYSQL_RO_PASSWORD}
      TZ: Asia/Taipei
    command: ["--default-time-zone=+08:00"]
    ports:
      - "127.0.0.1:3307:3306"     # 讓你在 Mac 上用工具查詢
    volumes:
      - mysql_data:/var/lib/mysql
      # 第一次啟動時，依照編號自動執行所有 migration
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  beat:
    <<: *app
    command: celery -A crawler.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule

  worker-collect:
    <<: *app
    command: celery -A crawler.celery_app worker -Q collect -c 1 -n collect@%h --loglevel=INFO

  worker-sync:
    <<: *app
    command: celery -A crawler.celery_app worker -Q sync -c 1 -n sync@%h --loglevel=INFO

  worker-aggregate:
    <<: *app
    command: celery -A crawler.celery_app worker -Q aggregate -c 1 -n aggregate@%h --loglevel=INFO

  worker-archive:
    <<: *app
    command: celery -A crawler.celery_app worker -Q archive -c 1 -n archive@%h --loglevel=INFO
    volumes:
      - archive_data:/data/archive

  # ---- Redash（Dashboard）----
  redash-server:
    <<: *redash
    command: server
    environment:
      <<: *redash-env
      REDASH_WEB_WORKERS: "2"
    ports:
      - "127.0.0.1:5001:5000"     # Redash 網頁（Mac 的 5000 被 AirPlay 占用）

  redash-scheduler:
    <<: *redash
    command: scheduler

  # 只有一個人使用，官方的 3 個 worker 合併成 1 個，負責全部佇列
  redash-worker:
    <<: *redash
    command: worker
    environment:
      <<: *redash-env
      QUEUES: queries,scheduled_queries,schemas,periodic,emails,default
      WORKERS_COUNT: "2"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redash 自己的設定資料（查詢、圖表、帳號），不是充電站資料
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${REDASH_POSTGRES_PASSWORD}
    volumes:
      - redash_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  rabbitmq_data:
  mysql_data:
  archive_data:
  redash_postgres_data:
